# Paste this at https://api.slack.com/apps -> Create New App -> From a manifest
display_information:
  name: Claude
  description: Lab replica of an AI teammate (@Claude) with a Sentinel audit trail
  background_color: "#c96442"
features:
  bot_user:
    display_name: Claude
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read     # receive @Claude mentions
      - chat:write            # reply in threads
      - chat:write.customize  # lets seed_channel.py post as fake personas
      - channels:history      # read recent channel messages for context
      - channels:read         # resolve channel names for the audit log
      - files:read            # see attachment metadata
      - users:read            # resolve user names for the audit log
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
